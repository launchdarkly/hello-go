version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly/*'

  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'github.com/launchdarkly/*'
